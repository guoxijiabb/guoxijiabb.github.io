/* Shared UI refinement. Brand colors and the established vector scenes stay intact. */
:root{
  --surface:#fff;--surface-muted:#f3f6fa;--line:#e2e9f1;
  --ink:#172438;--muted:#53647b;--blue:#1762cd;--blue-soft:#eaf2ff;
  --radius-control:14px;--ease-out:cubic-bezier(.23,1,.32,1);
  --ease-sheet:cubic-bezier(.32,.72,0,1);
}
::selection{background:#ccdef9;color:#172438}
input,select{caret-color:var(--blue)}
button,a{-webkit-tap-highlight-color:transparent}
button{font-variant-numeric:tabular-nums}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid #1762cd;outline-offset:3px;
}
.topbar{border-bottom-color:#e5ebf3}
.top-actions .quiet-button{font-size:13px;padding:10px 16px;border-radius:12px}
.quiet-button,.entry-button,.route-list button{
  transition:background-color 140ms ease,color 140ms ease,transform 130ms var(--ease-out);
}
.entry-button{font-size:14px;padding:15px 16px;border-radius:14px}
.route-list button{font-size:14px;padding:13px 12px}
.route-list button.active{background:#eaf2ff}
.intro-panel p{line-height:1.85}
.intro-panel h1{letter-spacing:-.025em}
.signature{font-size:13px;line-height:1.9}
.state-card{border:0;background:#eaf1f9;border-radius:16px;padding:20px;font-size:13px;line-height:1.85}
.demo-note{font-size:12px;line-height:1.8;color:#5c6e83}
.viewer-caption{color:#53647b}
.device{box-shadow:0 16px 42px #102a441b,0 3px 7px #102a4420}
.screen>svg{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
.hit{transition:background-color 100ms ease,transform 120ms var(--ease-out);outline-offset:-3px}
.hit:active{background:#1762cd12}
.hit:focus-visible{outline:2px solid #1762cd;outline-offset:-3px;background:#1762cd0a}
.hit.dark:focus-visible{outline-color:#b9dfff;background:#b9dfff12}
.hit--primary{
  color:#fff;background:#1762cd;border:0;border-radius:var(--radius-control);
  display:flex;align-items:center;justify-content:center;padding:0 12px;
  font-size:15px;font-weight:600;line-height:1.3;
  transition:transform 130ms var(--ease-out),background-color 130ms ease,opacity 130ms ease;
}
.hit--primary:active{transform:scale(.98);background:#1256b5}
.hit--primary:focus-visible{background:#1762cd;outline:3px solid #78adf6;outline-offset:3px}
.hit--primary:disabled{background:#dce5f1;color:#62758b;opacity:1;transform:none}
.hit--chip{
  display:flex;align-items:center;justify-content:center;gap:5px;color:#53647b;
  background:#f3f6fa;border:1px solid transparent;border-radius:10px;
  font-size:12px;line-height:1.2;font-weight:500;padding:0 5px;overflow:visible;
}
.hit--chip::after{content:"";position:absolute;inset:-5px 0}
.hit--chip.date-chip{background:#1762cd;color:#fff;font-size:11px;font-weight:600}
.hit--chip[aria-pressed=true]{background:#eaf2ff;border-color:#9ac0f5;color:#1762cd;font-weight:600}
.hit--chip.dark{background:#18374f;color:#c9dced}
.hit--chip.dark[aria-pressed=true]{background:#244966;border-color:#8dc9fb;color:#fff}
.hit--chip svg{width:12px;height:12px;flex:none}
.choice-hit{border-radius:16px}
.choice-hit[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px #9ccefa}
.select-dot{background:#1762cd;font-size:11px}
.native-input{color:#172438;font-size:16px;background:#f3f6fa;border-radius:8px}
.native-input::placeholder{color:#53647b;opacity:1}
.calendar{grid-template-columns:repeat(7,44px);grid-auto-rows:35px}
.calendar button{font-family:inherit;font-size:12px;border-radius:9px}
.calendar button.selected{border-radius:10px;background:#1762cd}
.calendar button.between{background:#eaf2ff;color:#1762cd;border-radius:0}
.calendar button:focus-visible{outline-width:2px;outline-offset:-3px}
.calendar button[aria-pressed=true]{font-weight:650}
.stepper-control{display:grid;place-items:center;color:#53647b!important;background:#fff!important;border:1px solid #e2e9f1;border-radius:12px}
.stepper-control svg{width:18px;height:18px}
.stepper-control:disabled{opacity:1;background:#f3f6fa!important;color:#b0becf!important;border-color:transparent}
.art-cover{z-index:1;overflow:hidden;pointer-events:none}.art-cover svg{width:100%;height:100%}
.app-tabbar{
  position:absolute;left:0;right:0;bottom:0;height:64px;padding:5px 4px 14px;
  display:grid;grid-template-columns:repeat(4,1fr);background:#fff;
  border-top:1px solid #e5ebf3;z-index:6;
}
.app-tabbar.dark{background:#102b40;border-top-color:#305063}
.app-tabbar button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:#64758a;background:transparent;border:0;border-radius:10px;font-size:11px;
  line-height:1.2;position:relative;padding:3px 0;
}
.app-tabbar svg{height:21px;width:21px;position:relative;z-index:1}
.app-tabbar button[aria-current=page]{color:#1762cd;font-weight:650}
.app-tabbar button[aria-current=page]::before{
  content:"";position:absolute;top:0;left:calc(50% - 22px);width:44px;height:28px;
  border-radius:10px;background:#eaf2ff;
}
.app-tabbar.dark button{color:#bdd1df}
.app-tabbar.dark button[aria-current=page]{color:#b5ddff}
.app-tabbar.dark button[aria-current=page]::before{background:#24455e}
.app-tabbar::after{content:"";position:absolute;left:calc(50% - 36px);bottom:7px;width:72px;height:4px;border-radius:4px;background:#172438;pointer-events:none}
.app-tabbar.dark::after{background:#d9e7f1}
.camp-list{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#b8c8db transparent}
.camp-row{
  display:flex;width:304px;min-height:130px;height:auto;background:white;border:0;
  border-bottom:1px solid #e5ebf3;padding:12px 0;text-align:left;color:#172438;gap:14px;
  align-items:center;border-radius:0;
}
.camp-row:last-child{border-bottom:0}
.camp-thumb{width:100px;height:104px;border-radius:14px;flex:none;overflow:hidden}
.camp-thumb svg{width:100%;height:100%;object-fit:cover}
.camp-copy{min-width:0;flex:1;padding:0;display:flex;flex-direction:column;gap:7px}
.camp-copy strong{font-size:15px;line-height:1.4;font-weight:650}
.camp-copy small{font-size:11px;line-height:1.45;color:#53647b}
.camp-copy small.verified{color:#167453;display:flex;gap:4px;align-items:center}
.camp-copy small.verified svg{width:12px;height:12px;flex:none}
.camp-price{font:650 20px/1.25 system-ui,sans-serif;color:#1762cd;margin-top:2px;font-variant-numeric:tabular-nums}
.camp-price em{font:11px "Microsoft YaHei",sans-serif;color:#53647b;margin-left:6px}
.empty-result{font-size:13px;color:#53647b;line-height:1.9;text-align:center;padding:40px 16px}
.empty-result button{display:block;margin:18px auto 0;padding:11px 18px;background:#eaf2ff;color:#1762cd;border:0;border-radius:12px;font-weight:600}
.list-count{font-size:11px;color:#53647b;line-height:1.5;padding:12px 0 0;margin:0}
.check-native{width:20px!important;height:20px!important;cursor:pointer}
.scrim{
  background:#04193266;border-radius:0;
  transition:background-color 140ms ease;overflow:hidden;
}
.sheet{
  max-height:calc(100% - 58px);padding:13px 20px 22px;border-radius:24px 24px 0 0;
  box-shadow:0 -10px 32px #04193218;animation:none;
  transition:transform 220ms var(--ease-sheet),opacity 160ms ease;transform:translateY(0);
  overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#becbdb transparent;
}
.sheet::before{content:"";display:block;margin:0 auto 19px;width:34px;height:4px;border-radius:4px;background:#c5d0df}
.sheet h2{font-size:20px;line-height:1.45;letter-spacing:-.02em;margin:0 30px 14px 0}
.sheet p{font-size:13px;line-height:1.8;color:#53647b;margin:12px 0}
.sheet p:empty{display:none}
.sheet p[id$=error]{color:#b93838;font-size:12px}
.sheet label{font-size:13px;margin:16px 0 7px;color:#172438}
.sheet input:not([type=checkbox]),.sheet select{font-size:16px;min-height:46px;padding:10px 12px;border-radius:12px;background:#f3f6fa;border-color:#dce5f0}
.sheet .primary{min-height:48px;border-radius:14px;font-size:15px;margin-top:20px;padding:12px 14px;line-height:1.4}
.sheet .secondary{min-height:44px;border-radius:14px;font-size:14px}
.sheet .checkline{min-height:48px;background:#f3f6fa;border-radius:12px;padding:12px;gap:10px;font-size:13px;line-height:1.6}
.sheet .checkline input{flex:none}
.sheet .close{width:36px;height:36px;display:grid;place-items:center;right:-6px;top:-5px;border-radius:50%;background:#f1f5fa;padding:0}
.sheet .close svg{width:18px;height:18px}
.scrim[data-phase=opening],.scrim[data-phase=closing]{background:#04193200}
.scrim[data-phase=opening] .sheet,.scrim[data-phase=closing] .sheet{transform:translateY(28px);opacity:0}
.scrim[data-phase=closing] .sheet{transition-duration:140ms}
.sheet .primary,.sheet .secondary,.native-page button{transition:transform 130ms var(--ease-out),background-color 130ms ease}
.sheet .primary:active,.sheet .secondary:active,.native-page button:active{transform:scale(.98)}
.toast{
  bottom:84px;left:20px;right:20px;background:#102b44f5;border-radius:12px;font-size:13px;
  padding:12px 14px;line-height:1.6;box-shadow:0 5px 16px #04193224;animation:none;
  opacity:1;transform:translateY(0);transition:opacity 130ms ease,transform 180ms var(--ease-out);
}
.toast[data-hidden=true]{opacity:0;transform:translateY(5px)}
.native-page{padding:58px 20px 92px;background:#fff;scrollbar-width:thin;scrollbar-color:#bdcddd transparent}
.native-page .section{border:0;border-radius:16px;background:#f3f6fa;padding:18px;margin:18px 0}
.native-page h1{font-size:25px;line-height:1.4;letter-spacing:-.025em}
.native-page p{font-size:13px;line-height:1.85;color:#53647b}
.native-page .section h2{font-size:16px}
.native-page button{border-radius:12px;min-height:42px;font-size:13px}
.native-page>.eyebrow{font-size:11px;letter-spacing:1.2px}
.native-page .native-nav{display:none}
.gallery{background:#f4f7fb}
.gallery-card{border-radius:12px;padding:7px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@media(hover:hover) and (pointer:fine){
  .hit:not(.hit--primary):not(.hit--chip):hover{background:#1762cd09}

  .hit--chip:hover{border-color:#b8cce6}
  .entry-button:hover,.camp-row:hover{background:#f5f8fd}
  .app-tabbar button:hover{color:#1762cd}
  .app-tabbar.dark button:hover{color:#b5ddff}
}
@media(max-width:680px){
  .top-actions .quiet-button{font-size:11px;padding:7px 10px;border-radius:10px}

  .hit,.hit--primary,.hit--chip,.sheet,.scrim,.toast,.quiet-button,.entry-button,.route-list button,.native-page button{transition:none!important;animation:none!important}

// Draw shared native controls on the original vector layout, then restore local focus.
function render(){
 const focused=document.activeElement;
 const action=controls.contains(focused)?focused.getAttribute('aria-label'):null;
 const previous=screen.dataset.page;
 renderBase();screen.dataset.page=current;screen.inert=false;controls.inert=false;
 const svg=screen.querySelector(':scope > svg');

   svg.setAttribute('aria-hidden','false');svg.setAttribute('role','img');
   svg.setAttribute('aria-label',labels[current]+'。'+[...svg.querySelectorAll('text')].filter(t=>getComputedStyle(t).visibility!=='hidden').map(t=>t.textContent).join('，'));
 }
 controls.querySelectorAll('.calendar button').forEach(b=>b.setAttribute('aria-pressed',String(b.classList.contains('selected'))));
 if(current==='location-list'){
   const dateButton=controls.querySelector('[data-action="修改出行日期"]');
   for(const r of screen.querySelectorAll('rect'))if(+r.getAttribute('x')===28&&+r.getAttribute('y')===174&&+r.getAttribute('width')===95)r.style.visibility='hidden';
   for(const t of screen.querySelectorAll('text'))if(+t.getAttribute('x')===75.5&&+t.getAttribute('y')===193)t.style.visibility='hidden';
   dateButton.classList.add('hit--chip','date-chip');dateButton.style.top='162px';dateButton.style.height='34px';dateButton.textContent=md(state.start)+'–'+md(state.end);
 }
 if(current==='onboarding-preferences'){
   for(const b of controls.querySelectorAll('button'))if(['享受独处','轻松同行','和熟悉的人出发'].includes(b.dataset.action)){

 }

 if(current==='planning-date-people'){
   for(const b of controls.querySelectorAll('button'))if(/^(增加|减少)(成人|车辆)$/.test(b.dataset.action||'')){
     const isAdd=b.dataset.action.startsWith('增加'),adult=b.dataset.action.endsWith('成人'),value=adult?state.adults:state.cars;

   }

 if(action&&previous===current){const same=[...controls.querySelectorAll('button,input')].find(b=>b.getAttribute('aria-label')===action&&!b.disabled);same?.focus({preventScroll:true});}
}
