          <p>第一次擦开霜窗，我只让你看见一朵红山茶。</p>
          <p>右边还有一团模糊的红，隐约能看见黑色瓶盖。戴米白色针织手套的手在窗沿停了一会儿，又从左下擦向右上。这次先露出瓶盖，再露出透光的红玻璃，最后才看清白标上的 <strong>L’EAU ROUGE</strong>。</p>
          <p>这是我为香奈儿一号红色之水设计的 <strong>15 秒 AI 概念短片</strong>。我最喜欢片尾还留着霜的那一圈玻璃。窗外是白的，窗里是暖的，刚好让那一抹红亮起来。</p>
