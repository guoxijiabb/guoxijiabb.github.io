          <p>雨刚停，他在站台用鞋尖拨了一颗石子。石子滚出画面，下一秒落在湿漉漉的山路上。</p>
          <p>等他回过神，公交已经开远了。他看了眼前面的路，抬脚就跑。湿泥里的脚步闷闷的，落到柏油上，又变得清脆。拐进巷子的时候，好像刚才想象里的那场奔跑，真的接到了回家的路上。</p>
          <p>这是我以 <strong>Salomon 萨洛蒙 XT-QUEST GTX</strong> 为主角做的一支 25 秒 AI 概念短片。</p>
